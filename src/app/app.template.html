<form ng-submit="addPost.mutate(data)">
  <div>
    <label
      >Name:
      <input type="text" ng-model="data.title" />
    </label>
  </div>
  <div>
    <label
      >Body:
      <textarea ng-model="data.body" rows="10"></textarea>
    </label>
  </div>
  <button type="submit" ng-disabled="vm.addPost.isMutating">Create</button>
</form>
<posts-tab></posts-tab>
